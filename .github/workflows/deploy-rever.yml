name: Deploy Rever (demo) to Cloud Run

on:
  push:
    branches: [claude/focused-tesla-n7hg2a]
    paths:
      - 'rever/**'
      - '.github/workflows/deploy-rever.yml'
  workflow_dispatch:

env:
  SERVICE_NAME: rever-demo
  REGION: me-west1
  IMAGE: me-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rever/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Permission tests
        working-directory: rever
        run: |
          npm ci
          npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure project and Docker
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud auth configure-docker me-west1-docker.pkg.dev --quiet

      - name: Create Artifact Registry (if not exists)
        run: |
          gcloud artifacts repositories describe rever --location=me-west1 2>/dev/null || \
          gcloud artifacts repositories create rever --repository-format=docker --location=me-west1 --description="Rever management system"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # דמו: בלי משתני Supabase, המערכת רצה עם נתוני דוגמה שנשמרים בדפדפן של כל מי שנכנס
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./rever
          file: ./rever/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi --cpu 1 \
            --min-instances 0 --max-instances 2

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Rever demo: $URL"
          echo "### Rever demo: $URL" >> $GITHUB_STEP_SUMMARY
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/today")
          echo "GET /today -> $code"; test "$code" = "200"
