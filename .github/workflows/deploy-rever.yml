name: Deploy Rever (demo) to Cloud Run

on:
  push:
    branches: [claude/focused-tesla-n7hg2a]
    paths:
      - 'rever/**'
      - '.github/workflows/deploy-rever.yml'
  workflow_dispatch:

env:
  SERVICE_NAME: rever-demo
  REGION: me-west1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Permission tests
        working-directory: rever
        run: |
          npm ci
          npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Pick image registry
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          echo "Existing Artifact Registry repositories:"
          gcloud artifacts repositories list --location=- --format="value(name)" || true
          # משתמשים במאגר קיים אם יש (לחשבון השירות אין הרשאה ליצור מאגר חדש)
          for cand in "me-west1/rever" "us-central1/compakt" "us-central1/cloud-run-source-deploy" "me-west1/cloud-run-source-deploy"; do
            loc=${cand%%/*}; repo=${cand##*/}
            if gcloud artifacts repositories describe "$repo" --location="$loc" >/dev/null 2>&1; then
              echo "IMAGE=$loc-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$repo/rever-app" >> $GITHUB_ENV
              echo "REG_HOST=$loc-docker.pkg.dev" >> $GITHUB_ENV
              echo "Using $cand"; exit 0
            fi
          done
          echo "Trying to create me-west1/rever"
          gcloud artifacts repositories create rever --repository-format=docker --location=me-west1 --description="Rever management system"
          echo "IMAGE=me-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rever/rever-app" >> $GITHUB_ENV
          echo "REG_HOST=me-west1-docker.pkg.dev" >> $GITHUB_ENV

      - name: Configure Docker
        run: gcloud auth configure-docker "$REG_HOST" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # דמו: בלי משתני Supabase, המערכת רצה עם נתוני דוגמה שנשמרים בדפדפן של כל מי שנכנס
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./rever
          file: ./rever/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi --cpu 1 \
            --min-instances 0 --max-instances 2

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Rever demo: $URL"
          echo "### Rever demo: $URL" >> $GITHUB_STEP_SUMMARY
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/today")
          echo "GET /today -> $code"; test "$code" = "200"
