name: Deploy promo site (GitHub Pages)

# Deploys ONLY the new promo site under ./promo to GitHub Pages.
# Independent from the existing site (site/ -> GCS bucket www.compaktt.com)
# and from the compakt backoffice (Cloud Run). Neither is touched here.
# Address: https://almog369cohen.github.io/Website_dj_almog_cohen/

on:
  push:
    branches: [main]
    paths:
      - 'promo/**'
      - '.github/workflows/deploy-promo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: promo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload promo folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: promo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
